services:
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --default-log-level=info
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  spark-streaming:
    profiles: ["streaming"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.streaming
    command: ["python", "-u", "/app/pipeline/streaming.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_LIVE_TOPIC: ${KAFKA_LIVE_TOPIC:-cosmic-eye-live}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the repository .env file}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cosmic_eye}
      ALERT_LATENCY_MS: ${ALERT_LATENCY_MS:-3000}
      ALERT_NOISE_SIGMA: ${ALERT_NOISE_SIGMA:-0.75}
      ALERT_SATURATED_FRACTION: ${ALERT_SATURATED_FRACTION:-0.25}
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
      SPARK_HOME: /opt/python/pyspark
      PYTHONPATH: /opt/python
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 3g
    volumes:
      - spark-checkpoints:/app/spark-checkpoints
      - ../pipeline/.venv/Lib/site-packages/pyspark:/opt/python/pyspark:ro
      - ../pipeline/.venv/Lib/site-packages/py4j:/opt/python/py4j:ro
    restart: "no"

volumes:
  spark-checkpoints:
