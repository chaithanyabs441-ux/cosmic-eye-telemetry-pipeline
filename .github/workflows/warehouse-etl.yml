name: BigQuery raw-to-curated ETL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/warehouse-etl.yml'
      - 'pipeline/dbt/**'
      - 'pipeline/requirements-etl.txt'
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigquery-warehouse-etl
  cancel-in-progress: false

jobs:
  build-curated:
    # Hosted runners are free for this project. Keep Atlas access limited to
    # the PC IP; run the optional warehouse-to-Mongo sync locally when needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: cosmic-eye-telemetry-demo
      BIGQUERY_LOCATION: US
      BIGQUERY_RAW_DATASET: raw
      BIGQUERY_CURATED_DATASET: curated
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements-etl.txt
      - name: Install dbt adapter
        run: python -m pip install -r pipeline/requirements-etl.txt
      - name: Validate secret and create temporary credentials file
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("GCP_SERVICE_ACCOUNT_KEY", "").strip()
          if not secret:
              raise SystemExit("Repository secret GCP_SERVICE_ACCOUNT_KEY is missing.")
          try:
              credentials = json.loads(secret)
          except json.JSONDecodeError as exc:
              raise SystemExit("GCP_SERVICE_ACCOUNT_KEY must contain a service-account JSON document.") from exc
          if credentials.get("type") != "service_account" or not credentials.get("client_email") or not credentials.get("private_key"):
              raise SystemExit("GCP_SERVICE_ACCOUNT_KEY is not a complete service-account JSON document.")
          Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]).write_text(
              json.dumps(credentials), encoding="utf-8"
          )
          PY
      - name: Build curated tables and run data-quality tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
        run: dbt build --project-dir pipeline/dbt --profiles-dir pipeline/dbt
      - name: Remove temporary credentials
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
        run: python -c "import os,pathlib; pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).unlink(missing_ok=True)"
