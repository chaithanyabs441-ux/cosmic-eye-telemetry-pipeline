name: BigQuery raw-to-curated ETL

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-curated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: cosmic-eye-telemetry-demo
      BIGQUERY_LOCATION: US
      BIGQUERY_RAW_DATASET: raw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dbt adapter
        run: python -m pip install -r pipeline/requirements-etl.txt
      - name: Create temporary credentials file
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python -c "import os,pathlib; pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).write_text(os.environ['GCP_SERVICE_ACCOUNT_KEY'], encoding='utf-8')"
      - name: Build curated tables and run data-quality tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
        run: dbt build --project-dir pipeline/dbt --profiles-dir pipeline/dbt
      - name: Remove temporary credentials
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cosmic-eye-gcp-key.json
        run: python -c "import os,pathlib; pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).unlink(missing_ok=True)"
